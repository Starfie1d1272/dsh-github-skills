name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      # actions/checkout@v4, SHA-pinned (verified immutable).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup@v4, SHA-pinned (the official dsh plugin manager uses pnpm).
      - name: Setup pnpm (profile plugin manager used by the install smoke)
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 11.21.0

      # actions/setup-node@v4, SHA-pinned.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}

      # The install smoke boots a real disposable DSH profile through the
      # actual `dsh` CLI, pinned to the reviewed rc.6 baseline.
      - name: Install DSH rc.6 (pinned baseline)
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Unit, safety, and structure tests
        run: npm test

      - name: Package validation (npm pack allowlist + isolated install)
        run: npm run pack:check

      - name: Disposable-profile install smoke (real dsh plugin add + skill discovery)
        run: npm run test:smoke

      - name: Verify packed tarball is present
        run: |
          node -e "const {version} = require('./package.json'); if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('invalid semver: ' + version)"
          git status --porcelain

name: CI

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      # actions/checkout@v7, SHA-pinned (verified immutable).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # pnpm/action-setup@v6, SHA-pinned (the official dsh plugin manager uses pnpm).
      - name: Setup pnpm (profile plugin manager used by the install smoke)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0

      # actions/setup-node@v7, SHA-pinned.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}

      # The install smoke boots a real disposable DSH profile through the
      # actual `dsh` CLI, pinned to the reviewed rc.6 baseline.
      - name: Install DSH rc.6 (pinned baseline)
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Unit, safety, and structure tests
        run: npm test

      - name: Package validation (npm pack allowlist + isolated install)
        run: npm run pack:check

      - name: Disposable-profile install smoke (real dsh plugin add + skill discovery)
        run: npm run test:smoke

      - name: Verify packed tarball is present
        run: |
          node -e "const {version} = require('./package.json'); if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('invalid semver: ' + version)"
          git status --porcelain

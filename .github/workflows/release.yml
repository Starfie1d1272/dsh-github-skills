name: Release

# npm Trusted Publishing: triggered by version tags (v*), this workflow
# verifies the tag against package.json and publishes to the official npm
# registry using the OIDC-issued identity — no NPM_TOKEN, no secrets.
#
# FIRST-RELEASE BOOTSTRAP (v0.1.0): npm's `npm trust` requires the package to
# already exist on the registry, so the very first publish cannot use
# Trusted Publishing. v0.1.0 must be published ONCE manually:
#   npm publish --access public
# AFTER the package exists, configure Trusted Publishing (npm >= 11.15.0):
#   npm trust github dsh-github-skills \
#     --repo Starfie1d1272/dsh-github-skills \
#     --file release.yml \
#     --allow-publish
# From the next version (v0.1.1) onward, pushing a v* tag runs this workflow
# and publishes automatically via OIDC, with npm provenance.
# See https://docs.npmjs.com/cli/v11/commands/npm-trust and
# https://docs.npmjs.com/trusted-publishers for the current rules.
#
# The tag push does not match ci.yml (`branches: [main]`), so this workflow
# re-runs the full validation (tests, package validation, and the
# disposable-profile install smoke) before publishing.

on:
  push:
    tags:
      - 'v*'

permissions:
  # Only the OIDC token for Trusted Publishing; nothing else is written.
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4, SHA-pinned (verified immutable).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # pnpm/action-setup@v4, SHA-pinned (the official dsh plugin manager uses pnpm).
      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 11.21.0

      # actions/setup-node@v4, SHA-pinned.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (and `npm trust` >= 11.15.0);
      # make the runner's npm deterministic instead of relying on the Node
      # release's bundled version.
      - name: Pin npm for trusted publishing
        run: npm install -g npm@11.5.1

      # The install smoke boots a real disposable DSH profile through the
      # actual `dsh` CLI, pinned to the reviewed rc.6 baseline.
      - name: Install DSH rc.6 (pinned baseline)
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Unit, safety, and structure tests
        run: npm test

      - name: Package validation (npm pack allowlist + isolated install)
        run: npm run pack:check

      - name: Disposable-profile install smoke
        run: npm run test:smoke

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version: ${TAG_VERSION}"
          echo "package version: ${PKG_VERSION}"
          test "${TAG_VERSION}" = "${PKG_VERSION}"

      # OIDC trusted publishing: npm exchanges the Actions id-token with the
      # registry automatically — no NODE_AUTH_TOKEN / NPM_TOKEN anywhere.
      # --provenance attaches the SLSA provenance signature to the published
      # version (requires the OIDC identity; see npm provenance docs).
      - name: Publish to npm
        run: npm publish --access public --provenance
